<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>영화 티어리스트 최종본</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        body {
            background-image: url('https://images.unsplash.com/photo-1526047932273-341f2a7631f9?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 { color: #444; text-shadow: 2px 2px 4px rgba(255,255,255,0.8); margin-bottom: 20px; }

        .input-section {
            background: rgba(255, 255, 255, 0.85);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
        }

        input { padding: 12px; border: 1px solid #ccc; border-radius: 10px; width: 250px; outline: none; font-size: 1rem; }
        
        button { padding: 10px 25px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: 0.2s; }
        .add-btn { background: #2d5a4c; color: white; } 
        .reset-btn { background: white; color: #2d5a4c; border: 1px solid #2d5a4c; }

        /* 상태 메시지 영역 */
        #status-display {
            width: 95%;
            max-width: 800px;
            height: 40px;
            color: #2d5a4c;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 10px;
        }

        .tier-container { width: 95%; max-width: 800px; background: rgba(255, 255, 255, 0.7); border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .tier-row { display: flex; border-bottom: 1px solid rgba(0,0,0,0.05); min-height: 110px; }
        
        .tier-label { 
            width: 80px; display: flex; align-items: center; justify-content: center; 
            font-weight: bold; font-size: 2rem; color: white; cursor: pointer;
            transition: 0.2s;
        }
        .tier-label:hover { filter: brightness(0.8); transform: scale(1.05); }

        .tier-content { flex: 1; display: flex; flex-wrap: wrap; padding: 10px; gap: 10px; min-height: 90px; }

        .tier-S .tier-label { background-color: #b0553d; } 
        .tier-S .tier-content { background-color: rgba(255, 255, 255, 0.4); }
        .tier-A .tier-label { background-color: #ffd6a5; }
        .tier-B .tier-label { background-color: #fdffb6; }
        .tier-C .tier-label { background-color: #caffbf; }
        .tier-D .tier-label { background-color: #9bf6ff; }

        .movie-card {
            border-radius: 12px; padding: 15px 10px; width: 120px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); position: relative; cursor: grab;
            text-align: center; border: 2px solid transparent;
            transition: all 0.2s;
        }
        /* 선택 효과 */
        .movie-card.selected { border: 3px solid #2d5a4c; transform: scale(1.05); z-index: 10; }

        .delete-btn { position: absolute; top: 4px; right: 6px; color: #666; cursor: pointer; font-size: 14px; font-weight: bold; }
        .movie-title { margin-bottom: 10px; font-weight: bold; font-size: 0.95rem; color: #333; pointer-events: none; }
        .star { cursor: pointer; color: rgba(0,0,0,0.1); font-size: 18px; transition: 0.2s; }
        .star.active { color: #ffcc00; }

        .storage { margin-top: 30px; width: 95%; max-width: 800px; background: rgba(255,255,255,0.85); border-radius: 15px; padding: 20px; border: 2px dashed #ffb7c5; }
        #storage-content { display: flex; flex-wrap: wrap; gap: 10px; min-height: 100px; }
        .clear-btn { background: #ff4d4d; color: white; font-size: 0.8rem; padding: 5px 10px; margin-left: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>🌸 나만의 영화 티어리스트</h1>

    <div class="input-section">
        <input type="text" id="movieInput" placeholder="영화 제목 추가" onkeyup="if(window.event.keyCode==13){addMovie()}">
        <button class="add-btn" onclick="addMovie()">추가</button>
        <button class="reset-btn" onclick="resetToStorage()">처음으로</button>
    </div>

    <!-- 초기 메시지 -->
    <div id="status-display">영화를 선택해 S·A·B·C로 나누어 보세요.</div>

    <div class="tier-container">
        <div class="tier-row tier-S"><div class="tier-label" onclick="moveSelectedTo('tier-S')">S</div><div class="tier-content" id="tier-S"></div></div>
        <div class="tier-row tier-A"><div class="tier-label" onclick="moveSelectedTo('tier-A')">A</div><div class="tier-content" id="tier-A"></div></div>
        <div class="tier-row tier-B"><div class="tier-label" onclick="moveSelectedTo('tier-B')">B</div><div class="tier-content" id="tier-B"></div></div>
        <div class="tier-row tier-C"><div class="tier-label" onclick="moveSelectedTo('tier-C')">C</div><div class="tier-content" id="tier-C"></div></div>
        <div class="tier-row tier-D"><div class="tier-label" onclick="moveSelectedTo('tier-D')">D</div><div class="tier-content" id="tier-D"></div></div>
    </div>

    <div class="storage">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3>📦 영화 보관함</h3>
            <button class="clear-btn" onclick="clearAll()">전체 초기화</button>
        </div>
        <div id="storage-content"></div>
    </div>

    <script>
        let selectedMovieCard = null;
        const statusDisplay = document.getElementById('status-display');
        const movieInput = document.getElementById('movieInput');
        const cardColors = ['#fff0d4', '#e5f1fb', '#e7f3ef', '#f3e7f3', '#fdfce5', '#ffe5e5'];
        const defaultMsg = "영화를 선택해 S·A·B·C로 나누어 보세요.";

        // 드래그 앤 드롭 설정
        const containers = [document.getElementById('storage-content'), ...document.querySelectorAll('.tier-content')];
        containers.forEach(el => {
            new Sortable(el, { 
                group: 'shared', 
                animation: 150, 
                onEnd: function(evt) {
                    const title = evt.item.querySelector('.movie-title').innerText;
                    // [요청사항] 옮겼을 때 메시지
                    statusDisplay.innerText = `${title}를 옮겼어요.`;
                    saveData();
                }
            });
        });

        function addMovie(title = null, rating = 0, targetId = 'storage-content', color = null) {
            const movieTitle = title || movieInput.value.trim();
            if (!movieTitle) return;

            const bgColor = color || cardColors[Math.floor(Math.random() * cardColors.length)];
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.style.backgroundColor = bgColor;
            
            // [요청사항] 클릭 시 선택/해제 토글 및 메시지
            card.onclick = function(e) {
                if(e.target.classList.contains('star') || e.target.classList.contains('delete-btn')) return;
                
                if(selectedMovieCard === card) {
                    // 이미 선택된 걸 다시 클릭하면 해제
                    card.classList.remove('selected');
                    selectedMovieCard = null;
                    statusDisplay.innerText = "선택을 해제 했어요";
                } else {
                    // 새로 선택
                    if(selectedMovieCard) selectedMovieCard.classList.remove('selected');
                    selectedMovieCard = card;
                    card.classList.add('selected');
                    statusDisplay.innerText = `사용자가 ${movieTitle}를 선택했어요.`;
                }
            };

            card.innerHTML = `
                <span class="delete-btn" onclick="this.parentElement.remove(); saveData();">×</span>
                <div class="movie-title">${movieTitle}</div>
                <div class="stars">
                    ${[1,2,3,4,5].map(i => `<span class="star ${i <= rating ? 'active' : ''}" onclick="setRating(this, ${i})">★</span>`).join('')}
                </div>
            `;
            document.getElementById(targetId).appendChild(card);
            if (!title) movieInput.value = "";
            saveData();
        }

        // [요청사항] 등급 클릭 시 이동 및 메시지
        function moveSelectedTo(tierId) {
            if(!selectedMovieCard) {
                statusDisplay.innerText = "⚠️ 먼저 영화 카드를 클릭하여 선택해주세요!";
                return;
            }
            const title = selectedMovieCard.querySelector('.movie-title').innerText;
            document.getElementById(tierId).appendChild(selectedMovieCard);
            
            // [요청사항] 옮겼을 때 메시지
            statusDisplay.innerText = `${title}를 옮겼어요.`;
            
            selectedMovieCard.classList.remove('selected');
            selectedMovieCard = null;
            saveData();
        }

        function setRating(starEl, val) {
            const stars = starEl.parentElement.querySelectorAll('.star');
            stars.forEach((s, idx) => s.classList.toggle('active', idx < val));
            saveData();
        }

        function resetToStorage() {
            const storage = document.getElementById('storage-content');
            document.querySelectorAll('.tier-content').forEach(tier => {
                while (tier.firstChild) storage.appendChild(tier.firstChild);
            });
            statusDisplay.innerText = defaultMsg;
            saveData();
        }

        function clearAll() {
            if(confirm("정말 모든 데이터를 초기화할까요?")) {
                localStorage.removeItem('movieTierData_Final_V3');
                location.reload();
            }
        }

        function saveData() {
            const data = {};
            ['storage-content', 'tier-S', 'tier-A', 'tier-B', 'tier-C', 'tier-D'].forEach(id => {
                data[id] = Array.from(document.getElementById(id).children).map(card => ({
                    title: card.querySelector('.movie-title').innerText,
                    rating: card.querySelectorAll('.star.active').length,
                    color: card.style.backgroundColor
                }));
            });
            localStorage.setItem('movieTierData_Final_V3', JSON.stringify(data));
        }

        function loadData() {
            const saved = localStorage.getItem('movieTierData_Final_V3');
            if (saved) {
                const data = JSON.parse(saved);
                Object.keys(data).forEach(id => {
                    data[id].forEach(m => addMovie(m.title, m.rating, id, m.color));
                });
            } else {
                // 초기 샘플 영화 8개
                const initialMovies = ["기생충", "인터스텔라", "라라랜드", "센과 치히로의 행방불명", "어벤져스: 엔드게임", "범죄도시", "타이타닉", "토이 스토리"];
                initialMovies.forEach(t => addMovie(t, 0, 'storage-content'));
            }
        }

        loadData();
    </script>
</body>
</html>
